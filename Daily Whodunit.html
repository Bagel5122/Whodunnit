<!doctype html>
<!--
  DAILY WHODUNIT
  A once-a-day murder mystery. One file, no dependencies (fonts load from Google Fonts with fallbacks).

  HOW IT WORKS
  - Each day maps to one case (CASES[dayNum % CASES.length]). DAY0 is the launch date; the menu shows every day since.
  - Rule: exactly one suspect lied to the police, and that is the killer.
  - Questioning a suspect (first one free, then -15 points each) reveals their statement and, for most suspects, an exhibit.
  - Wrong accusation: -20 points. Three wrong accusations ends the case.
  - Progress and streaks are saved in localStorage.

  ADDING A CASE (append to the CASES array in the script)
  { title, intro, scene:"lib|vault|train", at:{suspectIndex:[x,y]}, place, spots:{suspectIndex:[[glyph,x,y]]},
    sus:[[ "", name, role, "Says: statement", "evidence text or empty" ], ... 5 suspects ],
    culprit: suspectIndex, reveal: "explanation" }
  New scenes go in the SC object. Each case needs one claim that can be disproved from the map.
-->

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Whodunit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Special+Elite&family=Caveat:wght@600&display=swap">
<style>
:root{--desk:#2b4740;--ondesk:#ece6d2;--paper:#e8e2d0;--paper2:#d9d2bb;--ink:#1c1b18;--mute:#5d5a4e;--red:#b32d2b;--line:#b3ab92;--tape:rgba(228,214,150,.8);
--disp:Anton,Impact,"Arial Narrow",sans-serif;--type:"Special Elite","Courier New",monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--desk:#13211d;--paper:#d6d0bc;--paper2:#c6bfa7;--red:#c23431}
}
:root[data-theme="dark"]{--desk:#13211d;--paper:#d6d0bc;--paper2:#c6bfa7;--red:#c23431}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--desk);color:var(--ondesk);font-family:var(--type);line-height:1.5}
#app{max-width:1060px;margin:0 auto;padding:22px 18px 16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--ondesk);outline-offset:3px}
p{margin:0}
.mast{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font:400 clamp(34px,10vw,46px)/1 var(--disp);text-transform:uppercase;letter-spacing:.02em;margin:0}
.sub{font-size:14px;opacity:.8;margin-top:6px}
.menu{width:46px;height:46px;border:2px solid var(--ondesk);background:transparent;border-radius:3px;display:grid;place-items:center;flex:none}
.menu svg{width:24px;height:24px;stroke:var(--ondesk);stroke-width:2.2;stroke-linecap:round}
.streak{display:flex;gap:22px;margin-top:14px;font-size:14px;opacity:.9}
.streak b{font:400 20px var(--disp);letter-spacing:.04em;margin-left:4px}
.file,.slip,.s,.verdict,.modal{color:var(--ink)}
.file{position:relative;background:var(--paper);margin-top:34px;padding:22px 20px 20px;border-radius:2px 4px 4px 4px;box-shadow:0 2px 0 rgba(0,0,0,.3),0 16px 26px -14px rgba(0,0,0,.7)}
.tab{position:absolute;left:0;top:-27px;background:var(--paper);padding:5px 18px 3px;border-radius:7px 7px 0 0;font:400 16px var(--disp);letter-spacing:.06em}
.file h2{font:400 30px/1.05 var(--disp);margin:0 0 10px;letter-spacing:.01em}
.file p{font-size:15.5px}
h3{display:flex;align-items:center;gap:12px;font:400 21px var(--disp);letter-spacing:.07em;margin:34px 0 16px}
h3:after{content:"";flex:1;border-top:2px dashed rgba(236,230,210,.35)}
.exh{display:grid;gap:18px}
.slip{position:relative;background:var(--paper);padding:20px 16px 14px;box-shadow:0 8px 14px -8px rgba(0,0,0,.65)}
.slip:before{content:"";position:absolute;top:-9px;left:50%;width:72px;height:18px;background:var(--tape);transform:translateX(-50%) rotate(-2deg)}
.r0{transform:rotate(-.7deg)}
.r1{transform:rotate(.6deg)}
.r2{transform:rotate(-.4deg)}
.r3{transform:rotate(.5deg)}
.lbl{display:block;font:400 14px var(--disp);letter-spacing:.09em;color:var(--red);margin-bottom:4px}
.slip p{font-size:15px}
.sus{display:grid;gap:12px}
.s{position:relative;display:grid;grid-template-columns:86px 1fr;padding:0;border:0;text-align:left;background:var(--paper);border-radius:3px;overflow:hidden;box-shadow:0 6px 12px -8px rgba(0,0,0,.7);transition:transform .12s}
.s:not(:disabled):hover{transform:translateY(-2px)}
.s:disabled{cursor:default}
.plate{position:relative;display:grid;place-items:center;background:var(--paper2);border-right:2px solid var(--ink);min-height:92px}
.plate:before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;background:repeating-linear-gradient(to bottom,var(--ink) 0 1.5px,transparent 1.5px 9px)}
.plate b{font:400 54px/1 var(--disp);margin-left:6px}
.plate i{position:absolute;right:6px;bottom:5px;font:normal 12px var(--type);background:var(--ink);color:var(--paper);padding:0 6px}
.info{display:flex;flex-direction:column;padding:12px 14px;gap:1px}
.info strong{font:400 21px/1.15 var(--disp);letter-spacing:.02em}
.info em{font-style:normal;font-size:13px;color:var(--mute)}
.info small{font-size:14px;margin-top:4px}
.s.sel{box-shadow:0 0 0 3px var(--red),0 6px 12px -8px rgba(0,0,0,.7)}
.s.sel .plate{background:var(--red)}
.s.sel .plate b{color:var(--paper)}
.s.cleared .plate,.s.cleared .info{opacity:.4}
.s[data-stamp]:after{content:attr(data-stamp);position:absolute;right:14px;top:50%;transform:translateY(-50%) rotate(-9deg);border:3px double var(--red);color:var(--red);padding:2px 12px;font:400 22px var(--disp);letter-spacing:.08em;text-transform:uppercase;background:rgba(232,226,208,.85)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;bottom:0;z-index:5;margin-top:28px;padding:12px 0 calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--desk);border-top:2px dashed rgba(236,230,210,.3)}
.lives{font-size:14px}
.accuse{font:400 20px var(--disp);letter-spacing:.07em;padding:12px 24px;background:var(--red);color:#fff3ec;border:3px double rgba(255,243,236,.75);border-radius:3px;transform:rotate(-1deg)}
.accuse:disabled{background:transparent;color:rgba(236,230,210,.6);border:2px dashed rgba(236,230,210,.4);transform:none;cursor:not-allowed}
.verdict{text-align:left;margin-top:26px;background:var(--paper);padding:26px 20px 20px;box-shadow:0 16px 26px -14px rgba(0,0,0,.7)}
.sw{text-align:center;margin:6px 0 0}
.verdict .sub{text-align:center;margin:0 0 18px;opacity:1;color:var(--mute)}
.verdict h2{font:400 28px/1.1 var(--disp);margin:0 0 10px;text-align:center;letter-spacing:.01em}
.verdict .score{text-align:center}
.endbtns{display:grid;gap:12px;margin-top:22px}
.endbtns .accuse{transform:none}
.plain{padding:12px;border:2px solid var(--ondesk);background:transparent;border-radius:3px;font:400 18px var(--disp);letter-spacing:.06em;color:var(--ondesk)}
.plain:hover{background:rgba(255,255,255,.1)}
.stamp{display:inline-block;font:400 40px/1 var(--disp);letter-spacing:.06em;text-transform:uppercase;color:var(--red);border:4px double var(--red);padding:6px 16px;transform:rotate(-4deg);animation:thump .5s cubic-bezier(.2,1.6,.4,1)}
.lost .stamp{color:var(--ink);border-color:var(--ink)}
@keyframes thump{from{transform:rotate(-4deg) scale(2.2);opacity:0}}
@media (prefers-reduced-motion:reduce){
.stamp{animation:none}
.s{transition:none}
}
.score{font:400 64px/1 var(--disp);margin:18px 0 8px}
.score small{font-size:22px;color:var(--mute)}
.verdict pre{white-space:pre-wrap;font:inherit;font-size:15px;background:var(--paper2);border:2px dashed var(--line);padding:10px 12px;margin:16px 0 14px}
.note{font-size:13px;color:var(--mute);margin-top:12px}
.ov{position:fixed;inset:0;z-index:10;background:rgba(6,14,11,.75);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);overflow-y:auto}
.modal{width:100%;max-width:440px;background:var(--paper);padding:18px 18px 12px;box-shadow:0 20px 40px rgba(0,0,0,.6)}
.mh{display:flex;justify-content:space-between;align-items:center}
.mh h2{font:400 28px var(--disp);margin:0;letter-spacing:.02em}
#closem{width:40px;height:40px;border:0;background:transparent;font-size:20px}
.modal .note{margin:4px 0 8px}
.day{display:grid;grid-template-columns:1fr auto;width:100%;text-align:left;padding:10px 6px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink)}
.day:hover,.day.cur{background:var(--paper2)}
.dn{font:400 18px var(--disp);letter-spacing:.04em}
.dd{font-size:13px;color:var(--mute)}
.ds{grid-column:1/3;font-size:14px}
.ds.bad{color:var(--red)}
.narrow{max-width:560px;margin:0 auto}
.cols{display:grid;gap:8px}
.right h3{margin-top:34px}
.tabs{display:none;grid-template-columns:1fr 1fr;margin-top:22px;border:2px solid var(--ondesk);border-radius:3px;overflow:hidden}
.tabs button{padding:10px 6px;border:0;background:transparent;font:400 17px var(--disp);letter-spacing:.06em;color:var(--ondesk)}
.tabs button.on{background:var(--ondesk);color:var(--desk)}
@media (min-width:900px){
.cols{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:34px;align-items:start}
.exh{grid-template-columns:1fr 1fr}
.mast{margin-bottom:0}
}
@media (max-width:899px){
.tabs{display:grid}
.pane.off{display:none}
.pane h3{display:none}
.exh{margin-top:26px}
.sus{margin-top:22px}
}
.exh{position:relative}
.string{position:absolute;left:0;top:0;z-index:0;overflow:visible;pointer-events:none;filter:drop-shadow(0 2px 1px rgba(0,0,0,.45))}
.string path{fill:none;stroke:#e5504a;stroke-width:2.6;stroke-linecap:round}
.slip:after{content:"";position:absolute;top:-7px;left:50%;width:15px;height:15px;border-radius:50%;transform:translateX(-50%);background:radial-gradient(circle at 35% 30%,#ff9a90,#c9312c 55%,#7a1512);box-shadow:0 2px 3px rgba(0,0,0,.5)}
.file .rule{margin-top:12px;padding:8px 10px;border-left:4px solid var(--red);background:var(--paper2);font-size:14px}
/* corkboard */
:root{--cork:#b88a58;--wood:#6a4426;--bw:clamp(7px,2vw,14px)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--cork:#7a5836;--wood:#3d2815}
}
:root[data-theme="dark"]{--cork:#7a5836;--wood:#3d2815}
html{background:var(--wood)}
body{color:var(--ink);min-height:100vh;border:var(--bw) solid var(--wood);background-color:var(--cork);
background-image:radial-gradient(rgba(80,48,20,.38) 1px,transparent 1.6px),radial-gradient(rgba(255,232,190,.26) 1px,transparent 1.6px),radial-gradient(rgba(60,32,12,.28) 1.6px,transparent 2.2px);
background-size:7px 7px,11px 11px,17px 17px;background-position:0 0,3px 4px,8px 2px;box-shadow:inset 0 0 80px rgba(50,28,10,.6)}
button:focus-visible{outline-color:var(--ink)}
.file:before,.verdict:before,.modal:before,.bar:before,.mast>div:before,.s:before{content:"";position:absolute;width:26px;height:5px;top:7px;left:14px;border-radius:2px;background:linear-gradient(#f4f6f7,#8c9298);box-shadow:0 1.5px 1px rgba(0,0,0,.55);rotate:-6deg;z-index:3}
.verdict,.modal,.mast>div{position:relative}
.s:before{left:auto;right:12px;top:6px;rotate:5deg}
.s:nth-child(odd){rotate:-.5deg}
.s:nth-child(even){rotate:.4deg}
.slip:before{content:none}
.mast>div{background:var(--paper);padding:14px 20px 10px;rotate:-.8deg;box-shadow:0 8px 14px -8px rgba(0,0,0,.7)}
.mast h1{color:var(--ink)}
.sub{opacity:.75}
.menu{background:var(--paper);border-color:var(--ink);box-shadow:0 6px 10px -6px rgba(0,0,0,.7)}
.menu svg{stroke:var(--ink)}
.streak{width:fit-content;background:var(--paper);color:var(--ink);padding:6px 16px;rotate:.6deg;opacity:1;margin-top:20px;box-shadow:0 6px 10px -6px rgba(0,0,0,.7)}
h3{display:inline-block;background:var(--paper);color:var(--ink);padding:4px 16px 2px;rotate:-1deg;margin:34px 0 20px;box-shadow:0 5px 8px -5px rgba(0,0,0,.7)}
h3:after{content:none}
.string path{stroke:#c9302a}
.bar{bottom:10px;background:var(--paper);color:var(--ink);border-top:0;border-radius:3px;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 12px);box-shadow:0 -4px 14px rgba(0,0,0,.35),0 8px 14px -8px rgba(0,0,0,.7)}
.bar .accuse:disabled{color:var(--mute);border-color:var(--line)}
.tabs{background:var(--paper);border-color:var(--ink);box-shadow:0 6px 10px -6px rgba(0,0,0,.7)}
.tabs button{color:var(--ink)}
.tabs button.on{background:var(--ink);color:var(--paper)}
.plain{background:var(--paper);color:var(--ink);border-color:var(--ink);box-shadow:0 6px 10px -6px rgba(0,0,0,.7)}
.plain:hover{background:var(--paper2)}
.verdict{box-shadow:0 10px 18px -10px rgba(0,0,0,.7)}
/* paper variety */
.file,.tab{background:#e2c88b}
.file .rule{background:rgba(255,255,255,.4)}
.slip.r0{background:radial-gradient(circle at 15px 30px,rgba(70,44,18,.75) 0 5px,transparent 5.5px),radial-gradient(circle at 15px calc(100% - 30px),rgba(70,44,18,.75) 0 5px,transparent 5.5px),linear-gradient(90deg,transparent 38px,rgba(200,70,60,.55) 38px 40px,transparent 40px),#f6f2e4;padding-left:52px}
.slip.r0 p,.slip.r3 p{line-height:24px;background:repeating-linear-gradient(to bottom,transparent 0 23px,rgba(90,130,175,.45) 23px 24px)}
.slip.r1{background:linear-gradient(#f7e377,#f1d450);padding:24px 18px 20px;border-radius:2px 2px 18px 2px/2px 2px 6px 2px;box-shadow:0 12px 12px -8px rgba(0,0,0,.6),inset 0 -14px 14px -14px rgba(120,90,0,.35)}
.slip.r1 p{font:600 22px/1.15 Caveat,"Bradley Hand","Segoe Script",cursive;color:#3b3000}
.slip.r2{background:#eceee7;border:1px solid #bfc4b8;padding-top:40px}
.slip.r2:before{content:"Evidence log";position:absolute;left:0;right:0;top:0;height:26px;background:var(--ink);color:#eceee7;font:400 13px/26px var(--disp);letter-spacing:.1em;padding-left:12px}
.slip.r3{background:linear-gradient(transparent 45px,#c9473c 45px 47px,transparent 47px),#fbf8ee;border-radius:3px;padding-top:20px}
.slip.r3 .lbl{margin-bottom:14px}
/* suspect cards */
.s{background:#f1ecdc;grid-template-columns:96px 1fr}
.plate{--ph:#b9c2c4;--hr:16px;--sil:radial-gradient(circle var(--hr) at 54% 36%,#45443f 98%,transparent 100%),radial-gradient(ellipse 38px 34px at 54% 100%,#45443f 98%,transparent 100%);background:var(--sil),var(--ph);min-height:110px}
.s:nth-child(2) .plate{--ph:#c9baa2;--hr:15px}
.s:nth-child(3) .plate{--ph:#a9bcae;--hr:17px}
.s:nth-child(4) .plate{--ph:#c4aeb5;--hr:16px}
.s:nth-child(5) .plate{--ph:#b2b6cb;--hr:18px}
.plate b{display:none}
.plate i{left:0;right:0;bottom:0;padding:2px 0;text-align:center;background:var(--ink);color:var(--paper);font:400 13px var(--disp);letter-spacing:.1em}
.plate i:before{content:"No. "}
.s.sel .plate{background:var(--sil),var(--red)}
.info{padding:14px 14px 12px}
.info small{border-left:3px solid var(--line);padding-left:9px;margin-top:8px;font-size:14px}
.st{display:block;font:400 12px var(--disp);letter-spacing:.09em;color:var(--red);margin-bottom:2px}
/* questioning + silhouettes */
.plate{--sil:radial-gradient(circle var(--hr) at 54% calc(100% - 30px - var(--hr)),#45443f 98%,transparent 100%),radial-gradient(ellipse 38px 34px at 54% 100%,#45443f 98%,transparent 100%)}
.s:not(:disabled):hover{transform:none}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.qbtn,.pick{font:400 15px var(--disp);letter-spacing:.06em;padding:6px 12px;border:2px solid var(--ink);border-radius:3px;color:var(--ink);background:transparent}
.qbtn{background:#f2c230;color:#2a2105}
.qbtn:hover{background:#ffd54a}
.pick:hover{background:var(--paper2)}
.pick.on{background:var(--red);border-color:var(--red);color:#fff3ec}
.info small.unk{border-left:3px dashed var(--line);color:var(--mute)}
.src{display:block;font-size:12px;color:var(--mute);margin-bottom:6px}
.slip.r1 .src{color:#6b5a10}
.empty{background:rgba(255,255,255,.2);border:2px dashed rgba(60,36,14,.55);border-radius:3px;padding:18px;font-size:15px}
/* scene photo + gap between head and body */
.plate{--sil:radial-gradient(circle var(--hr) at 54% calc(100% - 50px - var(--hr)),#45443f 98%,transparent 100%),radial-gradient(ellipse 38px 34px at 54% calc(100% - 8px),#45443f 98%,transparent 100%)}
.scene{margin:26px 0 0;background:#f8f5ec;padding:10px 10px 38px;position:relative;box-shadow:0 10px 16px -8px rgba(0,0,0,.7);rotate:-.5deg;color:#2a2518}
.scene svg{display:block;width:100%;height:auto;border:1px solid #cfc7b2}
.scene figcaption{position:absolute;left:14px;bottom:7px;font:600 20px/1 Caveat,"Bradley Hand","Segoe Script",cursive}
.scene:before{content:"";position:absolute;width:15px;height:15px;top:-7px;left:50%;border-radius:50%;transform:translateX(-50%);background:radial-gradient(circle at 35% 30%,#ff9a90,#c9312c 55%,#7a1512);box-shadow:0 2px 3px rgba(0,0,0,.5);z-index:3}
.scene .rl{font:400 11px "Special Elite","Courier New",monospace;fill:#fff;stroke:#1d2a33;stroke-width:3px;paint-order:stroke;stroke-linejoin:round}
.scene .ev{filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.scene svg{border-radius:3px}
.scene{padding:10px}
.scene figcaption{position:static;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px;margin-top:8px}
.scene figcaption small{font:400 12px "Special Elite","Courier New",monospace;color:#5d5a4e}
</style>
</head>
<body>
<div id="app"></div>
<script>
const CASES=[
{title:"The Candlestick in the Library",intro:"Lord Hale was found dead in his library, struck with a brass candlestick, when a scream rang out at 9:45 PM. Five people were in the house. Question each of them to hear their statement and see what turns up.",
sus:[["","Mr. Finch","The butler","Says: Rosa and I were setting the dining table together from 9:00 until the scream.","The library clock was smashed in the struggle and stopped at 9:40. A still-warm cigar stub lies just outside the library's garden door."],["","Rosa","The chef","Says: Finch and I were setting the dining table together from 9:00 until the scream.",""],["","Clara","The niece","Says: I was upstairs on the phone with my fiancé from 9:20 to 9:50. I watched Dr. Voss in the garden from my window. Wears size 6 heels.","Phone records show Clara's call ran from 9:20 to 9:50 on the upstairs landline, without a break."],["","Dr. Voss","The family doctor","Says: I was in the garden having a cigar from 9:15 until the scream. Wears size 9 shoes.","Dr. Voss points out boot prints on the wet lawn, running from the library's garden door to the greenhouse and back. They are size 11."],["","Tom","The gardener","Says: I was in the greenhouse until the scream. At 9:30 I saw Clara cross the lawn toward the library. Wears size 11 boots.","Tom admits Hale fired him this morning. The signed dismissal letter lies on Hale's desk."]],
culprit:4,scene:"lib",at:{0:[60,98],1:[98,98],2:[30,139],3:[360,70],4:[352,205]},place:"Floor plan: Hale Manor, ground floor",spots:{0:[["clock",262,28],["stub",302,86]],2:[["phone",80,136]],3:[["trail",304,72]],4:[["doc",225,52]]},reveal:"Tom was the liar. Fired that morning, he slipped into the library through the garden door, then invented a sighting of Clara to throw suspicion on her. The cigar stub only proved Dr. Voss was where he said he was. The hedge also blocks the view from the greenhouse to the library lawn, so Tom's sighting was impossible."},

  const x=it[0][1],y=it[0][2],my=C.my||Math.max(14,y-24);
  if(my+9<y-5)g+=`<path d="M${x} ${my+9}V${y-5}" stroke="#c9302a" stroke-width="2"/>`;
  g+=`<circle cx="${x}" cy="${my}" r="10" fill="#c9302a" stroke="#fff" stroke-width="2"/><text x="${x}" y="${my+4.5}" text-anchor="middle" font-size="13" fill="#fff" font-family="Anton,Impact,sans-serif">${LET[n]}</text>`});
 C.sus.forEach((_,i)=>{const a=(C.at||{})[i];if(a&&(S.done||S.asked.includes(i)))t+=tk(i,a[0],a[1])});
 return `<figure class="scene"><svg viewBox="0 0 400 ${C.vh||260}" role="img" aria-label="${C.place}">${SC[C.scene]}${g}${t}</svg><figcaption><span>${C.place}</span><small>Numbers: where each suspect says they were. Letters: evidence. Check what people say they could see.</small></figcaption></figure>`;
}
function render(){
 const left=3-S.wrong.length;
 const order=S.asked.concat(S.done?C.sus.map((_,i)=>i).filter(i=>!S.asked.includes(i)):[]);
 const ex=order.filter(i=>C.sus[i][4]);
 const menuBtn=`<button class="menu" id="menu" aria-label="Open case archive"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>`;
 if(S.done&&!review){
  const g=C.sus[C.culprit];
  let e=`<div class="narrow"><header class="mast"><div><h1>Daily Whodunit</h1></div>${menuBtn}</header>
  <section class="verdict ${S.won?'won':'lost'}"><p class="sub">Case file No. ${caseNo}: ${C.title}</p><div class="sw"><div class="stamp">${S.won?'Case closed':'Unsolved'}</div></div><p class="score">${score()}<small>/100</small></p><h2>${S.won?'You caught ':'It was '}${g[1]}, ${g[2].toLowerCase()}</h2><p>${C.reveal}</p><pre id="sharetxt">${shareText()}</pre><p class="note">Streak: ${stats.streak} day${stats.streak===1?'':'s'}. Solved ${stats.wins} of ${stats.played}. ${dayNum===TODAY?'A new case arrives tomorrow.':'Archive cases do not count toward your streak.'}</p></section>
  <div class="endbtns"><button class="accuse" id="copy">Copy result</button><button class="plain" id="another">Play another case</button><button class="plain" id="review">Review the case file</button></div></div>`;
  if(menuOpen)e+=archiveHTML();
  $('#app').innerHTML=e;
  if(!menuOpen)scrollTo(0,0);
  return;
 }
 let h=`<header class="mast"><div><h1>Daily Whodunit</h1><p class="sub">Case file No. ${caseNo}${dayNum===TODAY?'':', from the archive'}</p></div>${menuBtn}</header>
 <div class="streak"><span>Streak<b>${stats.streak}</b></span><span>Solved<b>${stats.wins}/${stats.played}</b></span></div>
 <div class="tabs"><button data-tab="ev" class="${tab==='ev'?'on':''}">Case file (${ex.length})</button><button data-tab="su" class="${tab==='su'?'on':''}">Suspects (${S.asked.length}/5)</button></div>
 <div class="cols"><div class="pane left${tab==='ev'?'':' off'}">
 <section class="file"><div class="tab">Case ${caseNo}</div><h2>${C.title}</h2><p>${C.intro}</p><p class="rule">The rule: exactly one suspect lied to the police, and that is the killer. Everyone else told the truth. Check each claim against the map.</p></section>${sceneHTML(ex)}
 <h3>Evidence</h3><div class="exh">`;
 if(!ex.length)h+=`<div class="empty">Nothing pinned yet. Question a suspect to hear their statement and see what evidence turns up.</div>`;
 ex.forEach((i,n)=>{h+=`<article class="slip r${n%4}"><span class="lbl">Exhibit ${LET[n]}</span><span class="src">From questioning ${C.sus[i][1]}</span><p>${C.sus[i][4]}</p></article>`});
 h+=`</div></div><div class="pane right${tab==='su'?'':' off'}"><h3>Suspects</h3><div class="sus">`;
 C.sus.forEach((s,i)=>{
  const w=S.wrong.includes(i),g=S.done&&i===C.culprit,known=S.done||S.asked.includes(i);
  const stamp=w?' data-stamp="Innocent"':g?' data-stamp="Guilty"':'';
  let acts='';
  if(!S.done){
   if(!known)acts+=`<button class="qbtn" data-q="${i}">Question${S.asked.length?' (-15 pts)':' (free)'}</button>`;
   if(!w)acts+=`<button class="pick${sel===i?' on':''}" data-p="${i}">${sel===i?'Selected':'Pick as killer'}</button>`;
  }
  h+=`<div class="s${w?' cleared':''}${sel===i?' sel':''}${g?' guilty':''}" data-i="${i}"${stamp}><span class="plate"><i>${i+1}</i></span><span class="info"><strong>${s[1]}</strong><em>${s[2]}</em>${known?`<small><span class="st">Statement</span>${s[3].replace(/^Says:\s*/,'')}</small>`:`<small class="unk">Not questioned yet.</small>`}${acts?`<span class="acts">${acts}</span>`:''}</span></div>`;
 });
 h+=`</div></div></div>`;
 if(!S.done)h+=`<div class="bar"><span class="lives">Questions asked: ${S.asked.length}. Accusations left: ${'\u25CF'.repeat(left)}${'\u25CB'.repeat(3-left)}</span><button class="accuse" id="acc"${sel===null?' disabled':''}>${sel===null?'Pick a suspect':'Accuse '+C.sus[sel][1]}</button></div>`;
 else h+=`<div class="bar"><span class="lives">Reviewing a finished case</span><button class="accuse" id="back">Back to results</button></div>`;
 if(menuOpen)h+=archiveHTML();
 $('#app').innerHTML=h;
 drawStrings();
}
$('#app').addEventListener('click',async e=>{
 if(e.target.classList.contains('ov')){menuOpen=false;render();return}
 const t=e.target.closest('button');if(!t)return;
 if(t.dataset.tab){tab=t.dataset.tab;render();return}
 if(t.id==='menu'){menuOpen=true;render();return}
 if(t.id==='closem'){menuOpen=false;render();return}
 if(t.id==='another'){menuOpen=true;render();return}
 if(t.id==='review'){review=true;render();scrollTo(0,0);return}
 if(t.id==='back'){review=false;render();return}
 if(t.classList.contains('day')){setDay(+t.dataset.n);menuOpen=false;render();scrollTo(0,0);return}
 if(t.dataset.q){S.asked.push(+t.dataset.q);save('ww3:'+key,S)}
 else if(t.dataset.p){sel=+t.dataset.p}
 else if(t.id==='acc'&&sel!==null){
  if(sel===C.culprit)finish(true);
  else{S.wrong.push(sel);if(S.wrong.length>=3)finish(false)}
  sel=null;save('ww3:'+key,S)}
 else if(t.id==='copy'){
  try{await navigator.clipboard.writeText(shareText());t.textContent='Copied'}
  catch(err){const r=document.createRange();r.selectNodeContents($('#sharetxt'));const g=getSelection();g.removeAllRanges();g.addRange(r);t.textContent='Selected. Copy it manually.'}
  return}
 render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&menuOpen){menuOpen=false;render()}});
addEventListener('resize',drawStrings);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawStrings);
render();
</script>
</body>
</html>
